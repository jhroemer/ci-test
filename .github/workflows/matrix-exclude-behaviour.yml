on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, macos]
        version: [1, 2, 3]
        exclude:
          - { os: linux, version: 1 }
          - { os: macos }
          - { os: linux, version: '3' }
    steps:
      - run: echo ${{ matrix.os }}-${{ matrix.version }}

  object_exclude:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { name: a, lang: js }
          - { name: b, lang: ts }
          - { name: c, lang: py }
        exclude:
          - config: { name: a, lang: js }
          - config: { name: b }
    steps:
      - run: echo ${{ matrix.config.name }}kk
